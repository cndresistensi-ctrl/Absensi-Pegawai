<!DOCTYPE html>
<html lang="id">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Presensi Digital - SIPAM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        html, body { height: 100%; }
        body { min-height: 100vh; min-height: 100svh; }
        #kartuUtama { max-height: 97vh; max-height: 97svh; }
        #kotakKamera { max-height: 30vh; max-height: 30svh; }
        .border-gold-glow { border: 1px solid rgba(212,175,55,0.5); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), 0 0 30px rgba(212,175,55,0.15); }
        .text-gold { color: #d4af37; }

        .scan-frame { position: absolute; inset: 0; pointer-events: none; }
        .scan-corner { position: absolute; width: 34px; height: 34px; border-color: #d4af37; transition: border-color .3s ease; }
        .scan-corner.tl { top: 10px; left: 10px; border-top: 4px solid; border-left: 4px solid; border-radius: 10px 0 0 0; }
        .scan-corner.tr { top: 10px; right: 10px; border-top: 4px solid; border-right: 4px solid; border-radius: 0 10px 0 0; }
        .scan-corner.bl { bottom: 10px; left: 10px; border-bottom: 4px solid; border-left: 4px solid; border-radius: 0 0 0 10px; }
        .scan-corner.br { bottom: 10px; right: 10px; border-bottom: 4px solid; border-right: 4px solid; border-radius: 0 0 10px 0; }
        .scan-frame.terkunci .scan-corner { border-color: #10b981; }

        @keyframes scanline { 0% { top: 6%; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { top: 92%; opacity: 0; } }
        .scan-line { position: absolute; left: 6%; right: 6%; height: 2px; background: linear-gradient(90deg, transparent, #d4af37, transparent); animation: scanline 2.6s ease-in-out infinite; }
        .scan-frame.terkunci .scan-line { background: linear-gradient(90deg, transparent, #10b981, transparent); animation-play-state: paused; opacity: 0; }

        .pulse-dot { animation: pulseDot 1.6s ease-in-out infinite; }
        @keyframes pulseDot { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }

        .status-chip { transition: all .35s ease; }
        video, canvas { transform: scaleX(-1); }

        #splashScreen { transition: opacity .5s ease, visibility .5s ease; }
        #splashScreen.tersembunyi { opacity: 0; visibility: hidden; pointer-events: none; }
        @keyframes splashPulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: .85; } }
        .splash-logo { animation: splashPulse 1.6s ease-in-out infinite; }

        @keyframes centangMuncul { 0% { stroke-dashoffset: 48; } 100% { stroke-dashoffset: 0; } }
        @keyframes lingkaranMuncul { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        .lingkaran-sukses { animation: lingkaranMuncul .5s cubic-bezier(.34,1.56,.64,1) forwards; }
        .centang-sukses { stroke-dasharray: 48; stroke-dashoffset: 48; animation: centangMuncul .4s ease .35s forwards; }

        @keyframes kartuMasuk { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .kartu-animasi { animation: kartuMasuk .3s ease; }
    </style>
</head>
<body class="bg-gradient-to-br from-[#022c22] to-[#064e3b] flex items-center justify-center p-2 sm:p-4 relative overflow-hidden">

    <div id="splashScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-gradient-to-br from-[#022c22] to-[#064e3b]">
        <img src="https://i.ibb.co.com/v40vx8y4/52583ff7-d459-4803-af74-dec0cbc4be0b.png" alt="Logo" class="splash-logo w-20 h-20 sm:w-24 sm:h-24 rounded-full object-cover border-2 border-[#d4af37] shadow-lg mb-4">
        <p class="text-white font-black text-lg tracking-tight">Presensi Digital</p>
        <p class="text-emerald-200/70 text-[10px] font-bold uppercase tracking-widest mt-1">SIPAM · ALAMUN</p>
    </div>

    <div class="absolute top-[-10%] left-[-5%] w-[600px] h-[600px] bg-[#fcf6ba] opacity-[0.08] rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-5%] w-[600px] h-[600px] bg-[#d4af37] opacity-[0.12] rounded-full blur-[120px] pointer-events-none"></div>

    <div id="kartuUtama" class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-2xl sm:rounded-3xl p-3 sm:p-6 z-10 relative border-gold-glow overflow-y-auto">
        <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-[#bf953f] via-[#fcf6ba] to-[#bf953f] rounded-t-2xl sm:rounded-t-3xl"></div>

        <div class="text-center mb-2 sm:mb-3 mt-1">
            <img src="https://i.ibb.co.com/v40vx8y4/52583ff7-d459-4803-af74-dec0cbc4be0b.png" alt="Logo Al-Azhar Muncar" class="w-9 h-9 sm:w-14 sm:h-14 mx-auto mb-1 rounded-full object-cover border-2 border-[#d4af37] shadow-md">
            <h1 class="text-sm sm:text-xl font-black text-[#022c22] tracking-tight leading-none">Presensi Digital</h1>
            <p class="text-gray-500 text-[8px] sm:text-[11px] font-bold uppercase tracking-widest mt-0.5">SIPAM · Al-Azhar Muncar</p>
            <p id="jamRealtime" class="text-[#022c22] text-[9px] sm:text-[11px] font-bold mt-1 tabular-nums"></p>
        </div>

        <div class="mb-2 sm:mb-3">
            <label class="block text-gray-700 text-[9px] sm:text-[10px] font-black uppercase tracking-widest mb-1">NIPY Anda</label>
            <input type="text" id="inputNipy" inputmode="numeric" placeholder="Masukkan NIPY" class="w-full px-3 py-2 sm:py-2.5 bg-gray-50 border border-emerald-100 rounded-xl text-[#022c22] outline-none focus:border-[#d4af37] focus:ring-4 focus:ring-[#d4af37]/10 font-mono font-bold text-center text-sm sm:text-base tracking-widest transition-all">
            <div id="kotakNama" class="hidden mt-1.5 px-2 py-1.5 rounded-lg text-[10px] sm:text-xs font-bold text-center kartu-animasi"></div>
        </div>

        <div id="kotakKamera" class="relative w-full aspect-square rounded-xl overflow-hidden bg-[#022c22] mb-2 sm:mb-3 shadow-inner mx-auto">
            <video id="videoLive" autoplay muted playsinline class="w-full h-full object-cover"></video>
            <canvas id="canvasOverlay" class="absolute inset-0 w-full h-full"></canvas>
            <div id="scanFrame" class="scan-frame">
                <div class="scan-corner tl"></div><div class="scan-corner tr"></div>
                <div class="scan-corner bl"></div><div class="scan-corner br"></div>
                <div class="scan-line"></div>
            </div>
            <div id="overlayPesanKamera" class="absolute inset-0 flex items-center justify-center bg-[#022c22] text-emerald-100 text-[10px] sm:text-xs font-bold text-center p-3 sm:p-5">
                Mengaktifkan kamera & model pendeteksi wajah...
            </div>
        </div>

        <div class="grid grid-cols-2 gap-1.5 sm:gap-2 mb-2 sm:mb-3">
            <div id="chipWajah" class="status-chip flex items-center gap-1.5 bg-gray-100 border border-gray-200 rounded-lg px-2 py-1.5 sm:py-2">
                <span class="w-2 h-2 rounded-full bg-gray-400 pulse-dot shrink-0" id="dotWajah"></span>
                <div class="leading-tight">
                    <p class="text-[7px] sm:text-[8px] font-black text-gray-400 uppercase tracking-widest">Wajah</p>
                    <p class="text-[9px] sm:text-[11px] font-bold text-gray-600" id="teksWajah">Mendeteksi...</p>
                </div>
            </div>
            <div id="chipLokasi" class="status-chip flex items-center gap-1.5 bg-gray-100 border border-gray-200 rounded-lg px-2 py-1.5 sm:py-2">
                <span class="w-2 h-2 rounded-full bg-gray-400 pulse-dot shrink-0" id="dotLokasi"></span>
                <div class="leading-tight">
                    <p class="text-[7px] sm:text-[8px] font-black text-gray-400 uppercase tracking-widest">Lokasi</p>
                    <p class="text-[9px] sm:text-[11px] font-bold text-gray-600" id="teksLokasi">Mencari GPS...</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-1.5 sm:gap-2 mb-2 sm:mb-3">
            <button type="button" id="btnMasuk" onclick="pilihJenis('Masuk')" class="py-2 rounded-xl font-black text-[11px] sm:text-xs border-2 border-[#022c22] bg-[#022c22] text-white transition-all">Presensi Masuk</button>
            <button type="button" id="btnPulang" onclick="pilihJenis('Pulang')" class="py-2 rounded-xl font-black text-[11px] sm:text-xs border-2 border-gray-200 text-gray-500 transition-all">Presensi Pulang</button>
        </div>

        <button id="btnRekam" onclick="rekamPresensi()" disabled class="w-full bg-gray-300 text-gray-500 font-black text-sm sm:text-base py-2.5 sm:py-3 rounded-xl shadow-inner cursor-not-allowed flex items-center justify-center gap-2 transition-all duration-300">
            <span id="labelBtnRekam">Menyiapkan Sistem...</span>
        </button>

        <div id="pesanHasil" class="hidden mt-2 sm:mt-3 text-[10px] sm:text-xs font-bold p-2.5 sm:p-3 rounded-xl text-center"></div>

        <p class="text-center text-[8px] text-gray-300 font-bold mt-2">Wajah &amp; lokasi direkam sebagai bukti kehadiran · © 2026 SIPAM</p>
    </div>

    <script>
        // =========================================================
        // WAJIB DIISI: URL Web App Apps Script Anda (yang diakhiri /exec)
        // Ambil dari Deploy > Manage deployments di project Apps Script.
        // Halaman ini SENGAJA di-hosting terpisah (bukan lewat doGet
        // Apps Script), karena Apps Script membungkus HTML dalam iframe
        // tersandbox yang memblokir akses kamera (getUserMedia).
        // =========================================================
        const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbwkMlKelC7ORqJYAu1zGLfX2UbXH15h9qw3JnzdHkaZk6B5xAwap6MSEt3x-Lkn9Q/exec';

        // Daftar semua lokasi kantor/cabang yang diizinkan untuk presensi.
        // Tambah/kurangi baris sesuai jumlah cabang yang ada, tidak dibatasi jumlahnya.
        const DAFTAR_LOKASI = [
            { nama: 'Pondok Pesantren Modern Al-Azhar Muncar',  lat: -8.425996, lng: 114.328325 },
            { nama: 'PPM. Al-Azhar Muncar 2',      lat: -8.426536, lng: 114.321653 }, // SESUAIKAN
            { nama: 'Cabang 3',      lat: -8.000000, lng: 114.000000 }, // SESUAIKAN
            { nama: 'Cabang 4',      lat: -8.000000, lng: 114.000000 }, // SESUAIKAN
        ];
        const RADIUS_METER = 200;          // SESUAIKAN: radius toleransi (meter), samakan dengan Code.gs
        const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js/weights';

        let jenisPresensi = 'Masuk';
        let wajahTerdeteksi = false;
        let lokasiValid = false;
        let jarakSaatIni = null;
        let namaLokasiTerdekat = null;
        let videoEl, canvasEl, ctx;
        let timerCekNipy = null;
        let namaPegawaiAktif = null;

        // ---------- JAM REAL-TIME ----------
        function updateJamRealtime() {
            const sekarang = new Date();
            const teks = sekarang.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
                + ' · ' + sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const el = document.getElementById('jamRealtime');
            if (el) el.innerText = teks;
        }
        updateJamRealtime();
        setInterval(updateJamRealtime, 1000);

        // ---------- SPLASH SCREEN ----------
        function sembunyikanSplash() {
            const splash = document.getElementById('splashScreen');
            if (splash) splash.classList.add('tersembunyi');
        }
        setTimeout(sembunyikanSplash, 4000); // jaring pengaman kalau kamera lama merespons

        // ---------- SAPAAN SESUAI JAM ----------
        function sapaanSaatIni() {
            const jam = new Date().getHours();
            if (jam < 10) return 'Selamat Pagi';
            if (jam < 15) return 'Selamat Siang';
            if (jam < 18) return 'Selamat Sore';
            return 'Selamat Malam';
        }

        function pilihJenis(jenis) {
            jenisPresensi = jenis;
            const bMasuk = document.getElementById('btnMasuk');
            const bPulang = document.getElementById('btnPulang');
            if (jenis === 'Masuk') {
                bMasuk.className = "py-3 rounded-xl font-black text-sm border-2 border-[#022c22] bg-[#022c22] text-white transition-all";
                bPulang.className = "py-3 rounded-xl font-black text-sm border-2 border-gray-200 text-gray-500 transition-all";
            } else {
                bPulang.className = "py-3 rounded-xl font-black text-sm border-2 border-[#022c22] bg-[#022c22] text-white transition-all";
                bMasuk.className = "py-3 rounded-xl font-black text-sm border-2 border-gray-200 text-gray-500 transition-all";
            }
        }

        function hitungJarakMeter(lat1, lng1, lat2, lng2) {
            const R = 6371000;
            const toRad = d => d * Math.PI / 180;
            const dLat = toRad(lat2 - lat1);
            const dLng = toRad(lng2 - lng1);
            const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Mencari lokasi TERDEKAT dari seluruh DAFTAR_LOKASI, mengembalikan
        // nama cabang & jaraknya (dalam meter).
        function cariLokasiTerdekat(lat, lng) {
            let terdekat = null;
            let jarakTerdekat = Infinity;
            DAFTAR_LOKASI.forEach(lokasi => {
                const jarak = hitungJarakMeter(lat, lng, lokasi.lat, lokasi.lng);
                if (jarak < jarakTerdekat) {
                    jarakTerdekat = jarak;
                    terdekat = lokasi.nama;
                }
            });
            return { nama: terdekat, jarak: Math.round(jarakTerdekat) };
        }

        function mulaiPantauLokasi() {
            if (!navigator.geolocation) { setStatusLokasi(false, 'Perangkat tidak mendukung GPS'); return; }
            navigator.geolocation.watchPosition(
                (pos) => {
                    const { latitude, longitude } = pos.coords;
                    const hasil = cariLokasiTerdekat(latitude, longitude);
                    jarakSaatIni = hasil.jarak;
                    namaLokasiTerdekat = hasil.nama;
                    window._koordinatTerakhir = { lat: latitude, lng: longitude };
                    if (jarakSaatIni <= RADIUS_METER) setStatusLokasi(true, `${hasil.nama} (${jarakSaatIni}m)`);
                    else setStatusLokasi(false, `Di luar area, terdekat ${hasil.nama} (${jarakSaatIni}m)`);
                    perbaruiTombolRekam();
                },
                (err) => { setStatusLokasi(false, 'Izin lokasi ditolak'); },
                { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
            );
        }

        function setStatusLokasi(valid, teks) {
            lokasiValid = valid;
            document.getElementById('teksLokasi').innerText = teks;
            const dot = document.getElementById('dotLokasi');
            const chip = document.getElementById('chipLokasi');
            if (valid) { dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500'; chip.className = 'status-chip flex items-center gap-2 bg-emerald-50 border border-emerald-200 rounded-xl px-3 py-3'; }
            else { dot.className = 'w-2.5 h-2.5 rounded-full bg-red-400 pulse-dot'; chip.className = 'status-chip flex items-center gap-2 bg-red-50 border border-red-200 rounded-xl px-3 py-3'; }
        }

        async function mulaiKamera() {
            videoEl = document.getElementById('videoLive');
            canvasEl = document.getElementById('canvasOverlay');
            ctx = canvasEl.getContext('2d');

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 480, height: 480 }, audio: false });
                videoEl.srcObject = stream;
                await new Promise(resolve => videoEl.onloadedmetadata = resolve);
                document.getElementById('overlayPesanKamera').innerText = 'Memuat model pendeteksi wajah...';

                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);

                document.getElementById('overlayPesanKamera').classList.add('hidden');
                canvasEl.width = videoEl.videoWidth; canvasEl.height = videoEl.videoHeight;
                sembunyikanSplash();

                mulaiPantauLokasi();
                setInterval(deteksiWajahLoop, 350);
            } catch (e) {
                document.getElementById('overlayPesanKamera').innerText = 'Gagal mengakses kamera: ' + e.message;
                sembunyikanSplash();
            }
        }

        async function deteksiWajahLoop() {
            if (!videoEl || videoEl.readyState !== 4) return;
            const opsi = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });
            const hasil = await faceapi.detectSingleFace(videoEl, opsi);
            ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

            if (hasil) {
                wajahTerdeteksi = true;
                setStatusWajah(true, 'Wajah terdeteksi');
                document.getElementById('scanFrame').classList.add('terkunci');
                const { x, y, width, height } = hasil.box;
                ctx.strokeStyle = '#10b981'; ctx.lineWidth = 3; ctx.strokeRect(x, y, width, height);
            } else {
                wajahTerdeteksi = false;
                setStatusWajah(false, 'Posisikan wajah di dalam bingkai');
                document.getElementById('scanFrame').classList.remove('terkunci');
            }
            perbaruiTombolRekam();
        }

        function setStatusWajah(valid, teks) {
            document.getElementById('teksWajah').innerText = teks;
            const dot = document.getElementById('dotWajah');
            const chip = document.getElementById('chipWajah');
            if (valid) { dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500'; chip.className = 'status-chip flex items-center gap-2 bg-emerald-50 border border-emerald-200 rounded-xl px-3 py-3'; }
            else { dot.className = 'w-2.5 h-2.5 rounded-full bg-gray-400 pulse-dot'; chip.className = 'status-chip flex items-center gap-2 bg-gray-100 border border-gray-200 rounded-xl px-3 py-3'; }
        }

        function perbaruiTombolRekam() {
            const btn = document.getElementById('btnRekam');
            const label = document.getElementById('labelBtnRekam');
            const nipy = document.getElementById('inputNipy').value.trim();

            if (wajahTerdeteksi && lokasiValid && nipy !== '') {
                btn.disabled = false;
                btn.className = "w-full bg-gradient-to-r from-[#d4af37] to-[#b38728] hover:from-[#b38728] hover:to-[#d4af37] text-white font-black text-lg py-4 rounded-xl shadow-[0_10px_20px_-10px_rgba(212,175,55,0.6)] flex items-center justify-center gap-2 transition-all duration-300 transform hover:scale-[1.02]";
                label.innerText = '📸 Rekam Presensi ' + jenisPresensi;
            } else {
                btn.disabled = true;
                btn.className = "w-full bg-gray-300 text-gray-500 font-black text-lg py-4 rounded-xl shadow-inner cursor-not-allowed flex items-center justify-center gap-2 transition-all duration-300";
                label.innerText = !nipy ? 'Isi NIPY terlebih dahulu' : (!wajahTerdeteksi ? 'Menunggu wajah terdeteksi...' : 'Menunggu lokasi valid...');
            }
        }
        document.getElementById('inputNipy').addEventListener('input', () => {
            perbaruiTombolRekam();
            const kotak = document.getElementById('kotakNama');
            const nipy = document.getElementById('inputNipy').value.trim();
            namaPegawaiAktif = null;

            clearTimeout(timerCekNipy);
            if (nipy.length < 4) {
                kotak.classList.add('hidden');
                return;
            }
            timerCekNipy = setTimeout(() => cekNamaPegawai(nipy), 600);
        });

        // Cek nama pegawai ke backend (tanpa mencatat presensi apapun),
        // ditampilkan sebagai konfirmasi visual sebelum ambil foto.
        function cekNamaPegawai(nipy) {
            const kotak = document.getElementById('kotakNama');
            kotak.classList.remove('hidden');
            kotak.className = 'block mt-2 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold text-center kartu-animasi bg-gray-100 text-gray-500';
            kotak.innerText = 'Mencari nama...';

            fetch(URL_APPS_SCRIPT, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ aksi: 'cekNipy', nipy: nipy })
            })
            .then(res => res.json())
            .then(res => {
                // Cegah hasil basi kalau NIPY sudah berubah lagi saat menunggu respons
                if (document.getElementById('inputNipy').value.trim() !== nipy) return;
                if (res.success) {
                    namaPegawaiAktif = res.nama;
                    kotak.className = 'block mt-2 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold text-center kartu-animasi bg-emerald-50 text-emerald-700';
                    kotak.innerText = `👋 ${sapaanSaatIni()}, ${res.nama}!`;
                } else {
                    kotak.className = 'block mt-2 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold text-center kartu-animasi bg-red-50 text-red-500';
                    kotak.innerText = '⚠️ ' + res.message;
                }
            })
            .catch(() => {
                kotak.classList.add('hidden');
            });
        }

        // ---------- REKAM: kirim ke Apps Script (URL diri sendiri) lewat fetch() ----------
        function rekamPresensi() {
            const btn = document.getElementById('btnRekam');
            const label = document.getElementById('labelBtnRekam');
            const pesan = document.getElementById('pesanHasil');
            const nipy = document.getElementById('inputNipy').value.trim();

            btn.disabled = true;
            label.innerText = 'Menyimpan presensi... ⏳';
            pesan.classList.add('hidden');

            const canvasFoto = document.createElement('canvas');
            canvasFoto.width = videoEl.videoWidth; canvasFoto.height = videoEl.videoHeight;
            const ctxFoto = canvasFoto.getContext('2d');
            ctxFoto.translate(canvasFoto.width, 0); ctxFoto.scale(-1, 1);
            ctxFoto.drawImage(videoEl, 0, 0, canvasFoto.width, canvasFoto.height);
            ctxFoto.scale(-1, 1); ctxFoto.translate(-canvasFoto.width, 0); // kembalikan orientasi supaya teks tidak terbalik

            // ---------- WATERMARK: tanggal, jam, cabang di bagian bawah foto ----------
            const sekarangFoto = new Date();
            const teksTanggal = sekarangFoto.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
            const teksJam = sekarangFoto.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const teksCabang = namaLokasiTerdekat || '-';
            const tinggiBar = Math.round(canvasFoto.height * 0.14);
            const ukuranFontBesar = Math.max(14, Math.round(canvasFoto.width * 0.045));
            const ukuranFontKecil = Math.max(11, Math.round(canvasFoto.width * 0.032));

            ctxFoto.fillStyle = 'rgba(2, 44, 34, 0.72)';
            ctxFoto.fillRect(0, canvasFoto.height - tinggiBar, canvasFoto.width, tinggiBar);

            ctxFoto.fillStyle = '#ffffff';
            ctxFoto.textBaseline = 'middle';
            ctxFoto.font = `bold ${ukuranFontBesar}px sans-serif`;
            ctxFoto.fillText(`${teksTanggal} · ${teksJam}`, 14, canvasFoto.height - tinggiBar * 0.62);
            ctxFoto.fillStyle = '#d4af37';
            ctxFoto.font = `bold ${ukuranFontKecil}px sans-serif`;
            ctxFoto.fillText(`${teksCabang} · SIPAM Al-Azhar Muncar`, 14, canvasFoto.height - tinggiBar * 0.24);

            const fotoBase64 = canvasFoto.toDataURL('image/jpeg', 0.85);

            const payload = {
                nipy: nipy,
                jenis: jenisPresensi,
                latitude: window._koordinatTerakhir ? window._koordinatTerakhir.lat : null,
                longitude: window._koordinatTerakhir ? window._koordinatTerakhir.lng : null,
                jarakMeter: jarakSaatIni,
                namaLokasi: namaLokasiTerdekat,
                foto: fotoBase64
            };

            // Catatan teknis: Content-Type 'text/plain' sengaja dipakai (bukan application/json)
            // supaya browser TIDAK mengirim preflight OPTIONS request, karena Apps Script
            // tidak selalu merespons preflight dengan benar. Data tetap JSON di dalamnya.
            fetch(URL_APPS_SCRIPT, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                label.innerText = '📸 Rekam Presensi ' + jenisPresensi;
                pesan.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-emerald-50', 'text-emerald-700');

                if (res.success) {
                    // Getar HP kalau didukung perangkat
                    if (navigator.vibrate) navigator.vibrate([80, 40, 80]);

                    pesan.className = 'mt-3 sm:mt-4 rounded-xl text-center kartu-animasi bg-emerald-50 p-4 sm:p-5';
                    pesan.innerHTML = `
                        <svg class="lingkaran-sukses mx-auto mb-2" width="52" height="52" viewBox="0 0 52 52">
                            <circle cx="26" cy="26" r="24" fill="none" stroke="#10b981" stroke-width="3"/>
                            <path class="centang-sukses" d="M15 27l7 7 15-15" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <p class="text-emerald-700 font-black text-sm sm:text-base">${res.message}</p>
                        <p class="text-emerald-600/80 text-[11px] sm:text-xs font-bold mt-2">📊 Bulan ini: ${res.hadirBulanIni ?? 0} Hadir · ${res.terlambatBulanIni ?? 0} Terlambat</p>
                    `;
                    document.getElementById('inputNipy').value = '';
                    document.getElementById('kotakNama').classList.add('hidden');
                } else {
                    pesan.className = 'mt-3 sm:mt-4 text-xs sm:text-sm font-bold p-3 sm:p-4 rounded-xl text-center kartu-animasi bg-red-50 text-red-600';
                    pesan.innerText = '⚠️ ' + res.message;
                }
                perbaruiTombolRekam();
            })
            .catch(err => {
                label.innerText = '📸 Rekam Presensi ' + jenisPresensi;
                pesan.classList.remove('hidden');
                pesan.className = 'mt-4 text-sm font-bold p-4 rounded-xl text-center bg-red-50 text-red-600';
                pesan.innerText = '⚠️ Gagal terhubung ke server: ' + err.message;
                perbaruiTombolRekam();
            });
        }

        mulaiKamera();
    </script>
</body>
</html>
